<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--green:#281951;--green2:#3b2a70;--mint:#f0edf7;--gold:#d2a553;--ink:#211a31;--muted:#716c7b;--line:#e7e3ed;--paper:#fcfbfd;--white:#fff;--red:#ae463d;--shadow:0 18px 50px #28195112}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,6vw,88px);border-bottom:1px solid var(--line);background:#ffffffeb;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:12px;color:var(--green);font-family:Manrope,sans-serif;font-weight:800;font-size:15px;letter-spacing:.01em}.brandlogo{width:48px;height:48px;object-fit:cover;border-radius:9px;background:#1d123e;flex:none}.brandmark{width:36px;height:36px;border-radius:12px;background:var(--green);color:#f6ebd6;display:grid;place-items:center;font-family:Georgia,serif;font-size:20px}.toplinks{display:flex;gap:7px}.toplinks button,.back{border:0;background:none;color:var(--muted);padding:10px 13px;border-radius:9px;font-weight:600}.toplinks button:hover,.back:hover{background:var(--mint);color:var(--green)}main{max-width:1120px;margin:0 auto;padding:58px 24px 90px}.eyebrow{color:#92703a;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.hero{max-width:720px;margin:22px auto 42px;text-align:center}.hero h1{font:800 clamp(36px,5vw,56px)/1.08 Manrope,sans-serif;letter-spacing:-.045em;color:var(--green);margin:12px 0 16px}.hero p{color:var(--muted);font-size:16px;line-height:1.65;margin:0 auto;max-width:520px}.notice{max-width:720px;margin:0 auto 26px;padding:13px 16px;border-radius:12px;background:#f5efe3;color:#6d562d;font-size:13px;line-height:1.5;text-align:left}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:720px;margin:auto}.category{min-height:122px;background:white;border:1px color:var(--muted)}.admin{max-width:1240px}.adminhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:12px 0 28px}.adminhead h1{font:800 36px Manrope,sans-serif;color:var(--green);margin:7px 0}.adminhead p{color:var(--muted);margin:0}.tag{display:inline-flex;align-items:center;border-radius:99px;background:var(--mint);color:var(--green);padding:5px 10px;font-size:11px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:23px}.stat{padding:18px;background:white;border:1px solid var(--line);border-radius:14px}.stat span{color:var(--muted);font-size:12px}.stat b{display:block;font:800 27px Manrope,sans-serif;color:var(--green);margin-top:8px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:18px 0}.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink)}.toolbar input{min-width:210px}.tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:16px}.tab{white-space:nowrap;border:0;background:none;padding:12px 14px;color:var(--muted);font-weight:700;border-bottom:2px solid transparent}.tab.active{color:var(--green);border-color:var(--gold)}.tab span{font-size:11px;background:#eef2ee;padding:3px 7px;border-radius:99px;margin-left:5px}.list{display:grid;gap:11px}.submission{background:white;border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:15px}.submeta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}.submission p{font-size:14px;line-height:1.65;white-space:pre-wrap;margin:11px 0 2px}.actions{display:flex;gap:7px;flex-wrap:wrap;align-content:flex-start;justify-content:flex-end}.actions button{font-size:12px;padding:8px 10px}.danger{color:var(--red);border-color:#efd6d3}.empty{text-align:center;padding:50px 20px;color:var(--muted);background:white;border:1px dashed var(--line);border-radius:14px}.operator{max-width:1180px}.operator h1{font:800 38px Manrope,sans-serif;color:var(--green);margin:8px 0}.operatorgrid{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:24px;margin-top:22px}.queue{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;height:min(70vh,700px);overflow:auto}.queue h2{font:700 17px Manrope,sans-serif;color:var(--green);margin:5px 0 15px}.queueitem{border:1px solid var(--line);padding:13px;border-radius:11px;margin:9px 0;cursor:pointer}.queueitem.active{border-color:#6d927c;background:#f2f7f3}.queueitem b{font-size:13px}.queueitem small{display:block;color:var(--muted);margin-top:6px}.stage{background:#1d123e;border-radius:18px;min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:white;padding:36px;position:relative;overflow:hidden}.stage:before{content:'';position:absolute;width:420px;height:420px;border:1px solid #ffffff12;border-radius:50%;top:-300px;right:-90px}.stage .cop{position:absolute;top:27px;color:#edcf8c;font:700 11px Manrope,sans-serif;letter-spacing:.18em}.stage .displaycat{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#edcf8c;font-weight:700}.stage .displaytext{font:700 clamp(23px,3vw,39px)/1.35 Manrope,sans-serif;max-width:800px;margin:24px 0;white-space:pre-wrap;overflow-wrap:anywhere}.stage .displaytime{color:#c6d3ca;font-size:13px}.stage .placeholder{color:#cad7ce;font:600 23px Manrope,sans-serif}.stagebuttons{display:flex;gap:9px;margin-top:14px;justify-content:center}.operatorhint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:11px}.error{font-size:12px;color:var(--red);min-height:15px}.foot{padding:22px;text-align:center;color:#88938d;font-size:11px;border-top:1px solid var(--line)}.hidden{display:none!important}@media(max-width:760px){.topbar{height:64px;padding:0 16px}.toplinks button{padding:8px}.toplinks .oplink{display:none}main{padding:38px 16px 60px}.grid{gap:10px}.category{padding:15px;min-height:108px;gap:12px}.caticon{width:40px;height:40px}.stats{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:span 2}.adminhead{display:block}.adminhead .secondary{margin-top:15px}.submission{grid-template-columns:1fr}.actions{justify-content:flex-start}.operatorgrid{grid-template-columns:1fr}.queue{height:270px;order:2}.stage{min-height:360px}.toolbar input{flex:1;min-width:150px}}@media(max-width:420px){.grid{grid-template-columns:1fr}.category{min-height:90px}.brand{font-size:13px}}
</style></head>
<body><div id="app"></div>
<script>
const CATS=[{id:'testimony',name:'Testimony',icon:'✦',hint:'Share a story of gratitude or what God has done.'},{id:'prayer',name:'Prayer request',icon:'♡',hint:'Let the chapel community know how we can pray with you.'},{id:'bible',name:'Bible study question',icon:'⌘',hint:'Ask a question to explore together in Scripture.'},{id:'feedback',name:'Feedback',icon:'✎',hint:'Share an idea or feedback with chapel leadership.'}];
let items=[],selected='all',query='',queueSelection='',session=null,authLoading=true,loadedView='',dataError='',currentEntry=null,authMode='login';
async function apiFetch(path,options={}){const opts={credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}};const response=await fetch(path,opts);let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);return data}
function currentId(){return currentEntry?.id||''}function currentItem(){return currentEntry}
async function refreshAdmin(){const data=await apiFetch('/api/admin/submissions');items=data.items}async function refreshOperator(){const data=await apiFetch('/api/operations/testimonies');items=data.items;const current=await apiFetch('/api/display/current');currentEntry=current.item}
function loadProtectedData(view){dataError='';root().innerHTML=`${header()}<main><div class="empty">Loading ${view==='operations'?'approved testimonies':'submissions'}…</div></main>`;(view==='operations'?refreshOperator():refreshAdmin()).then(()=>{loadedView=view;render()}).catch(error=>{dataError=error.message;loadedView=view;render()})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cat(id){return CATS.find(c=>c.id===id)||CATS[0]}function stamp(iso){return new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(iso))}function setView(view){const old=getView();const u=new URL(location.href);if(view)u.searchParams.set('view',view);else u.searchParams.delete('view');history.pushState({},'',u);if(old!==view)loadedView='';render()}function getView(){return new URLSearchParams(location.search).get('view')||'submit'}function root(){return document.getElementById('app')}
function header(){return `<header class="topbar"><div class="brand"><img class="brandlogo" src="cop-logo.jpeg" alt="Chapel of Praise, McPherson University"><span>CHAPEL OF PRAISE <span style="font-weight:500;color:#829087">· CONNECT</span></span></div><nav class="toplinks"><button onclick="setView('submit')">Submit</button><button class="oplink" onclick="setView('operations')">Operations</button><button onclick="setView('admin')">Admin</button>${session?`<button onclick="signOut()">Sign out · ${esc(session.username)}</button>`:''}</nav></header>`}
function operatorHeader(){return `<header class="topbar"><div class="brand"><img class="brandlogo" src="cop-logo.jpeg" alt="Chapel of Praise, McPherson University"><span>CHAPEL OF PRAISE <span style="font-weight:500;color:#829087">· OPERATIONS</span></span></div><span><span class="tag">Media operator · testimonies only</span> <button class="back" onclick="signOut()">Sign out</button></span></header>`}
function loginPage(){return `${header()}<main><section class="formcard" style="max-width:470px;margin:30px auto"><div class="eyebrow">Authorized chapel staff</div><h2>Sign in</h2><p class="intro">Sign in to access the administration or approved testimony projection queue.</p><form onsubmit="signIn(event)"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div id="loginerror" class="error">${esc(dataError)}</div><button class="primary full" type="submit">Sign in</button></form><p class="hint" style="text-align:center;margin-top:20px">Need an account? <button class="back" type="button" onclick="openRegistration()">Create one with a role passkey</button></p></section></main>${footer()}`}
function registrationPage(){return `${header()}<main><section class="formcard" style="max-width:470px;margin:30px auto"><div class="eyebrow">Authorized chapel staff</div><h2>Create an account</h2><p class="intro">Select your role and enter the passkey given to you by chapel leadership.</p><form onsubmit="registerAccount(event)"><div class="field"><label for="role">Role</label><select id="role" name="role" class="form-select" required><option value="">Select your role</option><option value="superadmin">Super admin</option><option value="admin">Admin</option><option value="operator">Media operator</option></select></div><div class="field"><label for="registerusername">Username</label><input id="registerusername" name="username" autocomplete="username" required></div><div class="field"><label for="registerpassword">Password</label><input id="registerpassword" name="password" type="password" autocomplete="new-password" minlength="12" required><div class="hint">At least 12 characters.</div></div><div class="field"><label for="passkey">Role passkey</label><input id="passkey" name="passkey" type="password" autocomplete="off" required></div><div id="registererror" class="error">${esc(dataError)}</div><button class="primary full" type="submit">Create account</button></form><p class="hint" style="text-align:center;margin-top:20px"><button class="back" type="button" onclick="openLogin()">← Back to sign in</button></p></section></main>${footer()}`}
function openRegistration(){authMode='register';dataError='';render()}function openLogin(){authMode='login';dataError='';render()}
async function signIn(e){e.preventDefault();const f=new FormData(e.target);try{const result=await apiFetch('/api/auth/login',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password')})});session=result.user;dataError='';loadedView='';render()}catch(error){dataError=error.message;render()}}
async function registerAccount(e){e.preventDefault();const f=new FormData(e.target);try{await apiFetch('/api/auth/register',{method:'POST',body:JSON.stringify({role:f.get('role'),username:f.get('username'),password:f.get('password'),passkey:f.get('passkey')})});dataError='Account created. Sign in with your new username and password.';authMode='login';render()}catch(error){dataError=error.message;render()}}
async function signOut(){try{await apiFetch('/api/auth/logout',{method:'POST',body:'{}'})}catch{}session=null;items=[];currentEntry=null;loadedView='';setView('submit')}
function submitHome(){return `${header()}<main><section class="hero"><div class="eyebrow">A place to share · A community that listens</div><h1>What would you like to share?</h1><p>Choose a category below and send your message to Chapel of Praise.</p></section><div class="notice">Live display notice: submissions may be projected during chapel services. Please do not include private or sensitive information you would not want shown publicly.</div><div class="grid">${CATS.map(c=>`<button class="category" onclick="formView('${c.id}')"><span class="caticon">${c.icon}</span><span><b>${c.name}</b><small>${c.hint}</small></span><span class="arrow">›</span></button>`).join('')}</div></main>${footer()}`}
function formView(id){history.pushState({category:id},'',`?category=${id}`);render()}
function submitForm(id){const c=cat(id);return `${header()}<main><div class="formwrap"><button class="back" onclick="setView('submit')">← All categories</button><section class="formcard"><div class="eyebrow">${c.icon} &nbsp; ${c.name}</div><h2>Share with the chapel</h2><p class="intro">${c.hint}</p><form onsubmit="submitEntry(event,'${id}')"><div class="field"><label for="name">Your name <span style="font-weight:400;color:var(--muted)">· optional</span></label><input id="name" name="name" maxlength="60" placeholder="Enter your name"><div class="hint">Leave blank to submit anonymously.</div></div><div class="field"><label for="message">Your ${id==='bible'?'question':'message'}</label><textarea id="message" name="message" maxlength="2000" required placeholder="Write your ${id==='bible'?'question':'message'} here…"></textarea><div class="hint">Up to 2,000 characters.</div></div><label class="checkrow"><input type="checkbox" name="projection" required><span>I consent to submission</span></label><div id="formerror" class="error"></div><button class="primary full" type="submit">Submit ${c.name.toLowerCase()} <span aria-hidden="true">→</span></button></form></section></div></main>${footer()}`}
async function submitEntry(e,id){e.preventDefault();const f=new FormData(e.target),message=String(f.get('message')||'').trim();if(!message){document.getElementById('formerror').textContent='Please enter your message.';return}const button=e.submitter;button.disabled=true;try{await apiFetch('/api/submissions',{method:'POST',body:JSON.stringify({category:id,name:String(f.get('name')||'').trim(),message})});history.replaceState({},'',location.pathname+'?submitted=1');render()}catch(error){const target=document.getElementById('formerror');if(target)target.textContent=error.message;button.disabled=false}}
function success(){return `${header()}<main><section class="formcard success" style="max-width:590px;margin:40px auto"><div class="check">✓</div><div class="eyebrow">Message received</div><h2>Thank you for sharing.</h2><p>Your submission has been received by Chapel of Praise leadership. It can be displayed after it has been approved.</p><button class="primary" onclick="setView('submit')">Send another message</button></section></main>${footer()}`}
function footer(){return `<footer class="foot">Chapel of Praise · Congregation Connect</footer>`}
function dashboard(){const filtered=items.filter(x=>(selected==='all'||x.category===selected)&&(!query||`${x.message} ${x.name}`.toLowerCase().includes(query.toLowerCase())));return `${header()}<main class="admin"><div class="adminhead"><div><div class="eyebrow">Chapel leadership</div><h1>Submission dashboard</h1><p>Review congregation communications and manage the live display queue.</p></div><button class="secondary" onclick="setView('operations')">Open operations →</button></div><div class="stats"><div class="stat"><span>All submissions</span><b>${items.length}</b></div>${CATS.map(c=>`<div class="stat"><span>${c.name}</span><b>${items.filter(x=>x.category===c.id).length}</b></div>`).join('')}</div><div class="toolbar"><input aria-label="Search submissions" placeholder="Search messages or names" value="${esc(query)}" oninput="query=this.value;render()"><button class="secondary" onclick="downloadCsv()">Export CSV</button></div><div class="tabs"><button class="tab active" onclick="setView('admin')">All submissions <span>${items.length}</span></button><button class="tab" onclick="setView('review')">Further review <span>${items.filter(x=>x.status==='flagged').length}</span></button><button class="tab" onclick="setView('approved')">Approved <span>${items.filter(x=>x.status==='approved').length}</span></button>${CATS.map(c=>`<button class="tab ${selected===c.id?'active':''}" onclick="selectTab('${c.id}')">${c.name} <span>${items.filter(x=>x.category===c.id).length}</span></button>`).join('')}</div><div class="list">${filtered.length?filtered.map(submissionRow).join(''):`<div class="empty">No submissions here yet.</div>`}</div></main>${footer()}`}
function reviewPage(){const flagged=items.filter(x=>x.status==='flagged');return `${header()}<main class="admin"><div class="adminhead"><div><div class="eyebrow">Chapel leadership · screening</div><h1>Further review</h1><p>Flagged submissions are held here until they are approved or deleted.</p></div><button class="secondary" onclick="setView('admin')">← All submissions</button></div><div class="tabs"><button class="tab" onclick="setView('admin')">All submissions <span>${items.length}</span></button><button class="tab active">Further review <span>${flagged.length}</span></button><button class="tab" onclick="setView('approved')">Approved <span>${items.filter(x=>x.status==='approved').length}</span></button></div><div class="list">${flagged.length?flagged.map(x=>submissionRow(x,'review')).join(''):`<div class="empty">No flagged submissions need further review.</div>`}</div></main>${footer()}`}
function approvedPage(){const approved=items.filter(x=>x.status==='approved');return `${header()}<main class="admin"><div class="adminhead"><div><div class="eyebrow">Chapel leadership · cleared for display</div><h1>Approved submissions</h1><p>Approved testimonies are available to the media operator on the Operations page.</p></div><button class="secondary" onclick="setView('operations')">Open operations →</button></div><div class="tabs"><button class="tab" onclick="setView('admin')">All submissions <span>${items.length}</span></button><button class="tab" onclick="setView('review')">Further review <span>${items.filter(x=>x.status==='flagged').length}</span></button><button class="tab active">Approved <span>${approved.length}</span></button></div><div class="list">${approved.length?approved.map(x=>submissionRow(x,'approved')).join(''):`<div class="empty">No submissions have been approved yet.</div>`}</div></main>${footer()}`}
function submissionRow(x,context='all'){return `<article class="submission"><div><div class="submeta"><span class="tag">${cat(x.category).name}</span><span>${stamp(x.createdAt)}</span><span>·</span><span>${x.name?esc(x.name):'Anonymous'}</span><span class="tag">${x.status==='flagged'?'Flagged':x.status==='approved'?'Approved':'New'}</span><span class="tag">${x.projection==='hidden'?'Hidden':x.projection==='displayed'?'On screen':x.status==='approved'?'Available for display':'Awaiting review'}</span></div><p>${esc(x.message)}</p></div><div class="actions">${context==='review'?`<button class="primary" onclick="approveItem('${x.id}')">Approve for display</button><button class="secondary danger" onclick="deleteItem('${x.id}')">Delete</button>`:context==='approved'?`${x.category==='testimony'?`<button class="secondary" onclick="showOnScreen('${x.id}')">Display live</button>`:''}<button class="secondary" onclick="toggleFlag('${x.id}')">Send to further review</button><button class="secondary danger" onclick="deleteItem('${x.id}')">Delete</button>`:`<button class="secondary" onclick="approveItem('${x.id}')">Approve</button>${x.status==='flagged'?`<button class="secondary" onclick="setView('review')">Open further review</button>`:`<button class="secondary" onclick="toggleFlag('${x.id}')">Flag for further review</button>`}${x.status==='approved'&&x.category==='testimony'?`<button class="secondary" onclick="showOnScreen('${x.id}')">Display</button>`:''}<button class="secondary danger" onclick="deleteItem('${x.id}')">Delete</button>`}</div></article>`}
function selectTab(id){selected=id;render()}function refreshCurrentView(){loadedView='';render()}async function approveItem(id){try{await apiFetch(`/api/admin/submissions/${encodeURIComponent(id)}/approve`,{method:'POST',body:'{}'});await refreshAdmin();render()}catch(error){alert(error.message)}}async function toggleFlag(id){try{await apiFetch(`/api/admin/submissions/${encodeURIComponent(id)}/flag`,{method:'POST',body:'{}'});await refreshAdmin();render()}catch(error){alert(error.message)}}async function deleteItem(id){if(!confirm('Delete this submission permanently?'))return;try{await apiFetch(`/api/admin/submissions/${encodeURIComponent(id)}/delete`,{method:'POST',body:'{}'});await refreshAdmin();render()}catch(error){alert(error.message)}}async function showOnScreen(id){const entry=items.find(x=>x.id===id);if(!entry||entry.category!=='testimony'){alert('Only approved testimonies can be projected.');return}try{await apiFetch('/api/operator/current',{method:'POST',body:JSON.stringify({id})});await refreshOperator();setView('operations')}catch(error){alert(error.message)}}
function operator(){const pending=items.filter(x=>x.category==='testimony'&&x.status==='approved'&&x.projection!=='hidden');const active=queueSelection?items.find(x=>x.id===queueSelection&&x.category==='testimony'&&x.status==='approved'):currentItem();return `${operatorHeader()}<main class="operator"><div class="eyebrow">Media operations · approved testimonies only</div><h1>Testimony operations</h1><p style="color:var(--muted);margin:0">The testimony pile is arranged from earliest to latest submission. Select an entry to prepare it for live display.</p><div class="operatorgrid"><aside class="queue"><h2>Approved testimony pile <span class="tag">${pending.length}</span></h2>${pending.length?pending.map((x,index)=>`<div class="queueitem ${active?.id===x.id?'active':''}" onclick="queueSelection='${x.id}';render()"><b>${index+1}. Testimony</b><small>${stamp(x.createdAt)} · ${x.name?esc(x.name):'Anonymous'}</small><small>${esc(x.message.slice(0,100))}${x.message.length>100?'…':''}</small></div>`).join(''):`<div class="empty">No approved testimonies are ready for live display.</div>`}</aside><section><div class="stage">${active?`<div class="cop">CHAPEL OF PRAISE</div><div class="displaycat">Testimony</div><div class="displaytext">${esc(active.message)}</div><div class="displaytime">${stamp(active.createdAt)}${active.name?' · '+esc(active.name):''}</div>`:`<div class="cop">CHAPEL OF PRAISE</div><div class="placeholder">Select a testimony from the pile</div>`}</div><div class="stagebuttons"><button class="secondary" onclick="setCurrent()">Go live with selected</button><button class="secondary" onclick="nextItem()">Next testimony →</button><button class="secondary danger" onclick="clearScreen()">Clear screen</button></div><p class="operatorhint">This Operations page can access only approved testimonies. Use browser full screen (F11) and open the projector display separately.</p></section></div></main>${footer()}`}
async function setCurrent(){if(!queueSelection)return;try{await apiFetch('/api/operator/current',{method:'POST',body:JSON.stringify({id:queueSelection})});await refreshOperator();render()}catch(error){alert(error.message)}}async function nextItem(){const q=items.filter(x=>x.status==='approved'&&x.projection!=='hidden');if(!q.length)return;const i=q.findIndex(x=>x.id===currentId());const n=q[(i+1)%q.length];queueSelection=n.id;try{await apiFetch('/api/operator/current',{method:'POST',body:JSON.stringify({id:n.id})});await refreshOperator();render()}catch(error){alert(error.message)}}async function clearScreen(){try{await apiFetch('/api/operator/current',{method:'POST',body:JSON.stringify({id:null})});currentEntry=null;queueSelection='';render()}catch(error){alert(error.message)}}
function projector(){const x=currentItem();return `<div class="stage" style="position:fixed;inset:0;border-radius:0;min-height:100vh">${x?`<div class="cop">CHAPEL OF PRAISE</div><div class="displaycat">${cat(x.category).name}</div><div class="displaytext">${esc(x.message)}</div><div class="displaytime">${stamp(x.createdAt)}</div>`:`<div class="cop">CHAPEL OF PRAISE</div><div class="placeholder">Welcome</div>`}</div>`}
let projectorTimer=null,operatorTimer=null;async function pollProjector(){try{const result=await apiFetch('/api/display/current');const next=result.item;if((next?.id||'')!==(currentEntry?.id||'')||(next?.message||'')!==(currentEntry?.message||'')){currentEntry=next;root().innerHTML=projector()}}catch{}}async function pollOperator(){if(getView()!=='operations'||!session)return;const before=JSON.stringify([items.map(x=>x.id),currentEntry?.id||'']);try{await refreshOperator();const after=JSON.stringify([items.map(x=>x.id),currentEntry?.id||'']);if(before!==after)root().innerHTML=operator()}catch{}}
function downloadCsv(){const rows=[['Category','Name','Message','Submitted at','Review status','Projection status'],...items.map(x=>[cat(x.category).name,x.name||'Anonymous',x.message,x.createdAt,x.status,x.projection])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='cop-submissions.csv';a.click();URL.revokeObjectURL(a.href)}
function render(){const v=getView(),params=new URLSearchParams(location.search);if(v==='projector'){if(operatorTimer){clearInterval(operatorTimer);operatorTimer=null}root().innerHTML=projector();if(!projectorTimer){pollProjector();projectorTimer=setInterval(pollProjector,2000)}return}else if(projectorTimer){clearInterval(projectorTimer);projectorTimer=null}if(v!=='operations'&&operatorTimer){clearInterval(operatorTimer);operatorTimer=null}if(['admin','review','approved','operations'].includes(v)){if(authLoading){root().innerHTML=`${header()}<main><div class="empty">Checking staff access…</div></main>`;return}if(!session){root().innerHTML=authMode==='register'?registrationPage():loginPage();return}const allowed=v==='operations'?['operator','admin','superadmin'].includes(session.role):['admin','superadmin'].includes(session.role);if(!allowed){root().innerHTML=`${header()}<main><div class="empty">This account does not have access to this page. <button class="secondary" onclick="setView('submit')">Return to submissions</button></div></main>`;return}if(loadedView!==v){loadProtectedData(v);return}if(dataError){root().innerHTML=`${header()}<main><div class="empty">${esc(dataError)}<br><br><button class="secondary" onclick="refreshForRoute()">Try again</button></div></main>`;return}if(v==='admin'){root().innerHTML=dashboard();return}if(v==='review'){root().innerHTML=reviewPage();return}if(v==='approved'){root().innerHTML=approvedPage();return}root().innerHTML=operator();if(!operatorTimer)operatorTimer=setInterval(pollOperator,4000);return}if(params.has('submitted')){root().innerHTML=success();return}if(params.has('category')){const id=params.get('category');root().innerHTML=CATS.some(c=>c.id===id)?submitForm(id):submitHome();return}root().innerHTML=submitHome()}
function refreshForRoute(){loadedView='';render()}
async function initialize(){try{const result=await apiFetch('/api/session');session=result.user}catch{session=null}finally{authLoading=false;render()}}
window.addEventListener('popstate',()=>{loadedView='';render()});window.addEventListener('keydown',e=>{if(getView()==='operator'&&e.key==='ArrowRight')nextItem()});initialize();render();
</script></body></html>
